name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install contract test dependencies
        run: python3 -m pip install -r bin/requirements-test.txt

      - name: Run plugin validation suite
        run: ./bin/test-plugin.sh
